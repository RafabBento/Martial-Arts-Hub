openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Academia Fight Club API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User management
  - name: students
    description: Student profiles
  - name: sessions
    description: Training sessions
  - name: attendance
    description: Attendance tracking
  - name: face
    description: Facial recognition
  - name: rankings
    description: Attendance rankings
  - name: stats
    description: Dashboard statistics
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Confirm a user's email using the token sent at registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailInput"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid or expired token

  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Resend the verification email to the logged-in user
      responses:
        "200":
          description: Verification email resent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized

  /auth/complete-profile:
    post:
      operationId: completeProfile
      tags: [auth]
      summary: Complete the health/liability declaration for an existing account
      description: |
        Used to backfill the health declaration (and phone/birthDate) for
        accounts created before that questionnaire existed. Self only — the
        logged-in user completes their own profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteProfileInput"
      responses:
        "200":
          description: Profile completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset email
      description: |
        Always responds with a generic success message, whether or not the
        email is registered — prevents leaking which emails have an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Generic confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password using the token sent by /auth/forgot-password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid or expired token

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [student, teacher, admin]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List all students with their profiles
      parameters:
        - name: modality
          in: query
          schema:
            type: string
            enum: [thai, jiu, both]
        - name: search
          in: query
          schema:
            type: string
        - name: unit
          in: query
          schema:
            type: string
            enum: [matriz, panobianco, upfitness]
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentProfile"

  /students/{id}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get student profile by user ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "404":
          description: Not found
    patch:
      operationId: updateStudent
      tags: [students]
      summary: Update student profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentProfileUpdate"
      responses:
        "200":
          description: Updated student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List training sessions
      parameters:
        - name: modality
          in: query
          schema:
            type: string
            enum: [thai, jiu]
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingSession"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a training session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingSessionInput"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSession"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a training session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSession"
        "404":
          description: Not found
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a training session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /attendance:
    get:
      operationId: listAttendance
      tags: [attendance]
      summary: List attendance records
      parameters:
        - name: sessionId
          in: query
          schema:
            type: integer
        - name: studentId
          in: query
          schema:
            type: integer
        - name: modality
          in: query
          schema:
            type: string
            enum: [thai, jiu]
      responses:
        "200":
          description: List of attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
    post:
      operationId: createAttendance
      tags: [attendance]
      summary: Create attendance record (mark student present)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "201":
          description: Attendance recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"

  /attendance/{id}:
    delete:
      operationId: deleteAttendance
      tags: [attendance]
      summary: Remove an attendance record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /attendance/summary:
    get:
      operationId: getAttendanceSummary
      tags: [attendance]
      summary: Monthly attendance totals per person (students and teachers/admins)
      description: |
        Master (teacher/admin) receives one row per person who has any
        activity that month (students and teachers/admins); a student
        receives only their own row. Saturday Muay Thai sessions count
        double, same rule used elsewhere (student totals, rankings).
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: integer
        - name: year
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Monthly attendance summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceMonthSummary"
        "401":
          description: Unauthorized

  /rankings:
    get:
      operationId: listRankings
      tags: [rankings]
      summary: Get attendance rankings
      parameters:
        - name: modality
          in: query
          schema:
            type: string
            enum: [thai, jiu, both]
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, year, all]
      responses:
        "200":
          description: Ranked students by attendance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentRanking"

  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payment statuses for a given month/year
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: integer
        - name: year
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentStatus"

  /payments/{studentId}/{year}/{month}:
    put:
      operationId: markPayment
      tags: [payments]
      summary: Mark a student as paid for a month
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: year
          in: path
          required: true
          schema:
            type: integer
        - name: month
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkPaymentInput"
      responses:
        "200":
          description: Marked as paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatus"
    delete:
      operationId: unmarkPayment
      tags: [payments]
      summary: Unmark a student payment for a month
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: year
          in: path
          required: true
          schema:
            type: integer
        - name: month
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unmarked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /stats/dashboard:
    get:
      operationId: getDashboardStats
      tags: [stats]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /stats/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [stats]
      summary: Get recent training activity
      responses:
        "200":
          description: Recent activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /face/profile-photo:
    post:
      operationId: registerProfilePhoto
      tags: [face]
      summary: Set a user's profile photo and compute their reference face descriptor
      description: |
        Server downloads the uploaded photo, sets it as the user's profile photo,
        and (for students) detects the face and stores the 128-float descriptor used
        as the recognition reference. Returns faceDetected=false if no face is found.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterProfilePhotoInput"
      responses:
        "200":
          description: Profile photo saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePhotoResult"
        "400":
          description: Bad request
        "404":
          description: User not found

  /face/enroll:
    post:
      operationId: enrollFace
      tags: [face]
      summary: Enroll a student's face from multiple guided angle frames
      description: |
        Server downloads each uploaded frame (front/left/right/up/down burst),
        detects the best face per frame, deduplicates near-identical angles and
        stores multiple 128-float descriptors for the student. Replaces the
        student's previous multi-angle descriptor set. Also sets one frame as the
        profile photo when the user has none yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollFaceInput"
      responses:
        "200":
          description: Enrollment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollFaceResult"
        "400":
          description: Bad request
        "401":
          description: Not authenticated
        "403":
          description: Not allowed
        "404":
          description: User not found

  /face/recognize-team:
    post:
      operationId: recognizeTeam
      tags: [face]
      summary: Detect and identify all students in a whole-team post-training photo
      description: |
        Server downloads the team photo, detects every face, and matches each one
        against stored student reference descriptors. Returns each matched student
        with the modalities they train (so attendance can be marked in both).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecognizeTeamInput"
      responses:
        "200":
          description: Recognition result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamRecognitionResult"
        "400":
          description: Bad request

  /attendance/bulk:
    post:
      operationId: bulkAttendance
      tags: [attendance]
      summary: Mark attendance for many students in a single modality
      description: |
        Finds (or creates) today's session for the given modality and inserts an
        attendance record for each student if one does not already exist.
        Server-side dedupe prevents duplicate presence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAttendanceInput"
      responses:
        "200":
          description: Bulk attendance result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkAttendanceResult"
        "400":
          description: Bad request

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    RegisterInput:
      type: object
      required: [name, email, password, role, phone, birthDate, emergencyContactName, emergencyContactPhone, declarationAccepted]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [student, teacher]
        unit:
          type: string
          enum: [matriz, panobianco, upfitness]
          nullable: true
        phone:
          type: string
          minLength: 8
        birthDate:
          type: string
        paymentDay:
          type: integer
          nullable: true
          minimum: 1
          maximum: 31
        modalityThai:
          type: boolean
          nullable: true
        modalityJiu:
          type: boolean
          nullable: true
        bollacha:
          type: boolean
          nullable: true
        thaiGrade:
          type: string
          nullable: true
        thaiGradeColor:
          type: string
          nullable: true
        jiuGrade:
          type: string
          nullable: true
        jiuGradeColor:
          type: string
          nullable: true
        jiuDegree:
          type: integer
          nullable: true
        hasInjury:
          type: boolean
        injuryDetails:
          type: string
          nullable: true
        hasCondition:
          type: boolean
        conditionDetails:
          type: string
          nullable: true
        takesMedication:
          type: boolean
        medicationDetails:
          type: string
          nullable: true
        emergencyContactName:
          type: string
          minLength: 2
        emergencyContactPhone:
          type: string
          minLength: 8
        imageConsent:
          type: boolean
        guardianName:
          type: string
          nullable: true
        guardianPhone:
          type: string
          nullable: true
        declarationAccepted:
          type: boolean

    CompleteProfileInput:
      type: object
      required: [phone, birthDate, emergencyContactName, emergencyContactPhone, declarationAccepted]
      description: |
        Health/liability declaration subset of RegisterInput, used to backfill
        accounts created before that questionnaire existed.
      properties:
        phone:
          type: string
          minLength: 8
        birthDate:
          type: string
        hasInjury:
          type: boolean
        injuryDetails:
          type: string
          nullable: true
        hasCondition:
          type: boolean
        conditionDetails:
          type: string
          nullable: true
        takesMedication:
          type: boolean
        medicationDetails:
          type: string
          nullable: true
        emergencyContactName:
          type: string
          minLength: 2
        emergencyContactPhone:
          type: string
          minLength: 8
        imageConsent:
          type: boolean
        guardianName:
          type: string
          nullable: true
        guardianPhone:
          type: string
          nullable: true
        declarationAccepted:
          type: boolean

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    VerifyEmailInput:
      type: object
      required: [token]
      properties:
        token:
          type: string

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 6

    User:
      type: object
      required: [id, name, email, role, unit, emailVerified, profileComplete, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [student, teacher, admin]
        unit:
          type: string
          enum: [matriz, panobianco, upfitness]
        emailVerified:
          type: boolean
        profileComplete:
          type: boolean
          description: |
            True once the health/liability declaration has been filled out
            (at registration, or via /auth/complete-profile for accounts
            created before that questionnaire existed).
        phone:
          type: ["string", "null"]
        profilePhotoUrl:
          type: ["string", "null"]
        birthDate:
          type: ["string", "null"]
        paymentDay:
          type: ["integer", "null"]
        modalityThai:
          type: ["boolean", "null"]
        modalityJiu:
          type: ["boolean", "null"]
        thaiGrade:
          type: ["string", "null"]
